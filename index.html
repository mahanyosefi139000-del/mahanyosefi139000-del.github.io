<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>اینستاگرام دانلودر | GrimZone</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.3/dist/font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(135deg, #0b0d17 0%, #1a1d35 50%, #0b0d17 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .bg-animation {
            position: fixed;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(179,136,255,0.1), transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(0,229,255,0.08), transparent 60%);
            z-index: -1;
        }
        .container {
            max-width: 720px;
            width: 100%;
            background: rgba(19, 22, 38, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 48px;
            padding: 40px 32px;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }
        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(179,136,255,0.03), transparent, rgba(0,229,255,0.03), transparent);
            animation: rotate 20s linear infinite;
            z-index: 0;
        }
        @keyframes rotate {
            to { transform: rotate(360deg); }
        }
        .container > * { position: relative; z-index: 1; }
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo .icon-wrapper {
            display: inline-block;
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #b388ff, #00e5ff);
            border-radius: 28px;
            line-height: 80px;
            font-size: 2.8rem;
            color: #0b0d17;
            box-shadow: 0 0 40px rgba(179,136,255,0.3);
            margin-bottom: 16px;
        }
        .logo h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #b388ff, #00e5ff, #ff4081);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo p {
            color: #a0a6c0;
            font-size: 0.95rem;
            letter-spacing: 1px;
        }
        .type-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .type-selector button {
            flex: 1;
            min-width: 70px;
            padding: 10px 12px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04);
            color: #a0a6c0;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .type-selector button i { margin-left: 6px; }
        .type-selector button.active {
            background: linear-gradient(135deg, #b388ff, #00e5ff);
            color: #0b0d17;
            border-color: transparent;
            font-weight: 700;
            box-shadow: 0 0 25px rgba(179,136,255,0.3);
        }
        .type-selector button:hover:not(.active) {
            background: rgba(255,255,255,0.08);
            border-color: rgba(179,136,255,0.2);
        }
        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
        }
        .input-group input {
            flex: 1;
            padding: 16px 20px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
            font-family: inherit;
        }
        .input-group input::placeholder { color: #6a6f8a; }
        .input-group input:focus {
            border-color: #b388ff;
            box-shadow: 0 0 30px rgba(179,136,255,0.15);
        }
        .input-group button {
            padding: 16px 32px;
            border-radius: 40px;
            border: none;
            background: linear-gradient(135deg, #b388ff, #00e5ff);
            color: #0b0d17;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.95rem;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .input-group button:hover {
            transform: scale(1.04);
            box-shadow: 0 0 40px rgba(179,136,255,0.4);
        }
        .input-group button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 30px 0;
            color: #a0a6c0;
        }
        .loading i {
            font-size: 2.5rem;
            animation: spin 1s linear infinite;
            color: #b388ff;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .result {
            display: none;
            margin-top: 24px;
            padding: 20px;
            background: rgba(255,255,255,0.04);
            border-radius: 28px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .result img, .result video {
            width: 100%;
            border-radius: 20px;
            margin-bottom: 16px;
            max-height: 500px;
            object-fit: cover;
        }
        .result .info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .result .info .type-badge {
            background: rgba(179,136,255,0.15);
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 0.8rem;
            border: 1px solid rgba(179,136,255,0.15);
        }
        .result .info .download-btn {
            padding: 10px 28px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, #00e5ff, #b388ff);
            color: #0b0d17;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }
        .result .info .download-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 0 30px rgba(0,229,255,0.3);
        }
        .error {
            display: none;
            background: rgba(255,64,129,0.12);
            border: 1px solid rgba(255,64,129,0.3);
            padding: 14px 20px;
            border-radius: 20px;
            margin-top: 16px;
            color: #ff4081;
            text-align: center;
        }
        .footer {
            margin-top: 35px;
            padding-top: 25px;
            border-top: 1px solid rgba(255,255,255,0.06);
            text-align: center;
        }
        .footer .social-links {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-bottom: 14px;
        }
        .footer .social-links a {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #a0a6c0;
            text-decoration: none;
            transition: 0.3s;
        }
        .footer .social-links a:hover {
            background: linear-gradient(135deg, #b388ff, #00e5ff);
            color: #0b0d17;
            transform: translateY(-4px);
            box-shadow: 0 0 30px rgba(179,136,255,0.3);
        }
        .footer .dev-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 40px;
            padding: 8px 20px;
            font-size: 0.8rem;
            color: #a0a6c0;
            text-decoration: none;
            transition: 0.3s;
        }
        .footer .dev-link:hover {
            background: linear-gradient(135deg, #b388ff, #00e5ff);
            color: #0b0d17;
            box-shadow: 0 0 30px rgba(179,136,255,0.2);
        }
        .footer .dev-link i:first-child { color: #00e5ff; }
        .footer .dev-link:hover i:first-child { color: #0b0d17; }
        @media (max-width: 550px) {
            .container { padding: 24px 16px; border-radius: 32px; }
            .logo h1 { font-size: 1.5rem; }
            .input-group { flex-direction: column; }
            .input-group button { width: 100%; justify-content: center; }
            .type-selector button { font-size: 0.7rem; padding: 8px 10px; min-width: 60px; }
            .result .info { flex-direction: column; align-items: stretch; }
            .result .info .download-btn { justify-content: center; }
        }
    </style>
</head>
<body>
<div class="bg-animation"></div>

<div class="container">
    <!-- لوگو -->
    <div class="logo">
        <div class="icon-wrapper"><i class="fab fa-instagram"></i></div>
        <h1>اینستاگرام دانلودر</h1>
        <p>لینک پست، ریلز یا استوری را وارد کن</p>
    </div>

    <!-- انتخاب نوع محتوا -->
    <div class="type-selector">
        <button class="active" data-type="post2"><i class="fas fa-photo-film"></i> پست / ریلز</button>
        <button data-type="story"><i class="fas fa-circle-play"></i> استوری</button>
        <button data-type="highlight"><i class="fas fa-star"></i> هایلایت</button>
        <button data-type="info"><i class="fas fa-user"></i> اطلاعات پیج</button>
    </div>

    <!-- ورودی -->
    <div class="input-group">
        <input type="text" id="urlInput" placeholder="https://www.instagram.com/p/...">
        <button id="downloadBtn"><i class="fas fa-download"></i> دریافت</button>
    </div>

    <!-- لودینگ -->
    <div class="loading" id="loading">
        <i class="fas fa-spinner"></i>
        <p style="margin-top: 12px;">در حال دریافت اطلاعات...</p>
    </div>

    <!-- خطا -->
    <div class="error" id="error"></div>

    <!-- نتیجه -->
    <div class="result" id="result">
        <div id="mediaContainer"></div>
        <div class="info">
            <span class="type-badge" id="typeBadge">🎬 ویدیو / ریلز</span>
            <a href="#" id="downloadLink" class="download-btn" target="_blank">
                <i class="fas fa-arrow-down"></i> دانلود
            </a>
        </div>
    </div>

    <!-- فوتر با لینک‌ها -->
    <footer class="footer">
        <div class="social-links">
            <a href="https://www.instagram.com/i.mahan.yosefi" target="_blank" title="اینستاگرام"><i class="fab fa-instagram"></i></a>
            <a href="https://t.me/GrimZone2025" target="_blank" title="تلگرام"><i class="fab fa-telegram"></i></a>
            <a href="https://rubika.ir/luxuory" target="_blank" title="روبیکا"><i class="fas fa-cube"></i></a>
        </div>
        <a href="https://t.me/Broken4Her" target="_blank" class="dev-link">
            <i class="fas fa-code"></i>
            <span>طراح و توسعه‌دهنده</span>
            <i class="fas fa-arrow-up-right-from-square"></i>
        </a>
    </footer>
</div>

<script>
    // ========== تنظیمات ==========
    const API_BASE = 'https://api.fast-creat.ir/instagram';
    const API_KEY = '8492696944:zlMChRI2gHn8ALX@Api_ManagerRoBot';

    // ========== DOM ==========
    const urlInput = document.getElementById('urlInput');
    const downloadBtn = document.getElementById('downloadBtn');
    const loading = document.getElementById('loading');
    const error = document.getElementById('error');
    const result = document.getElementById('result');
    const mediaContainer = document.getElementById('mediaContainer');
    const typeBadge = document.getElementById('typeBadge');
    const downloadLink = document.getElementById('downloadLink');
    const typeButtons = document.querySelectorAll('.type-selector button');

    let currentType = 'post2';

    // ========== انتخاب نوع ==========
    typeButtons.forEach(btn => {
        btn.addEventListener('click', function() {
            typeButtons.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentType = this.dataset.type;
            if (currentType === 'info') {
                urlInput.placeholder = 'نام کاربری پیج (مثلاً: grimzone)';
            } else {
                urlInput.placeholder = 'https://www.instagram.com/p/...';
            }
            result.style.display = 'none';
            error.style.display = 'none';
        });
    });

    // ========== تابع اصلی ==========
    downloadBtn.addEventListener('click', async () => {
        const input = urlInput.value.trim();
        if (!input) {
            showError('لطفاً لینک یا نام کاربری را وارد کنید.');
            return;
        }

        downloadBtn.disabled = true;
        loading.style.display = 'block';
        result.style.display = 'none';
        error.style.display = 'none';

        try {
            let apiUrl = `${API_BASE}?apikey=${API_KEY}&type=${currentType}`;
            if (currentType === 'info') {
                apiUrl += `&username=${encodeURIComponent(input)}`;
            } else {
                apiUrl += `&url=${encodeURIComponent(input)}`;
            }

            console.log('درخواست به:', apiUrl);

            const response = await fetch(apiUrl);
            const data = await response.json();

            console.log('پاسخ:', data);

            if (!response.ok) {
                throw new Error(data.message || `خطای HTTP ${response.status}`);
            }
            if (data.status !== 'success') {
                throw new Error(data.message || 'درخواست ناموفق بود');
            }

            if (currentType === 'info') {
                displayProfileInfo(data.data);
            } else {
                displayMedia(data.data);
            }

        } catch (err) {
            console.error('خطا:', err);
            showError(err.message || 'خطا در ارتباط با سرور');
        } finally {
            downloadBtn.disabled = false;
            loading.style.display = 'none';
        }
    });

    // ========== نمایش مدیا ==========
    function displayMedia(data) {
        const items = data.items || data;
        const firstItem = Array.isArray(items) ? items[0] : items;
        if (!firstItem) { showError('محتوا یافت نشد.'); return; }

        const isVideo = firstItem.type === 'video' || firstItem.is_video;
        const mediaUrl = isVideo ? (firstItem.video_url || firstItem.url) : (firstItem.image_url || firstItem.url);

        if (!mediaUrl) { showError('لینک دانلود یافت نشد.'); return; }

        mediaContainer.innerHTML = isVideo
            ? `<video controls src="${mediaUrl}" playsinline></video>`
            : `<img src="${mediaUrl}" alt="پست اینستاگرام">`;

        typeBadge.textContent = isVideo ? '🎬 ویدیو / ریلز' : '🖼️ تصویر';
        downloadLink.href = mediaUrl;
        downloadLink.download = `instagram_${Date.now()}.${isVideo ? 'mp4' : 'jpg'}`;

        result.style.display = 'block';
        result.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // ========== نمایش اطلاعات پیج ==========
    function displayProfileInfo(data) {
        const user = data.user || data;
        mediaContainer.innerHTML = `
            <div style="display: flex; align-items: center; gap: 20px; padding: 10px 0; flex-wrap: wrap;">
                <img src="${user.profile_pic_url}" alt="پروفایل" style="width: 80px; height: 80px; border-radius: 50%; border: 2px solid #b388ff;">
                <div>
                    <h3 style="font-size: 1.3rem;">${user.full_name || user.username}</h3>
                    <p style="color: #a0a6c0;">@${user.username}</p>
                    <p style="color: #a0a6c0; font-size: 0.9rem;">${user.bio || ''}</p>
                    <div style="display: flex; gap: 20px; margin-top: 8px; flex-wrap: wrap;">
                        <span><i class="fas fa-images"></i> ${user.posts || 0}</span>
                        <span><i class="fas fa-users"></i> ${user.followers || 0}</span>
                        <span><i class="fas fa-user-plus"></i> ${user.following || 0}</span>
                    </div>
                </div>
            </div>
        `;
        typeBadge.textContent = '👤 اطلاعات پیج';
        downloadLink.href = user.profile_pic_url || '#';
        downloadLink.download = `profile_${user.username}.jpg`;
        downloadLink.textContent = 'دانلود عکس پروفایل';
        result.style.display = 'block';
        result.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // ========== نمایش خطا ==========
    function showError(msg) {
        error.textContent = msg;
        error.style.display = 'block';
        result.style.display = 'none';
    }

    // ========== اجرا با Enter ==========
    urlInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') downloadBtn.click();
    });
</script>
</body>
    </html>
