<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetRed | گردونه شانس</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 30px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .score {
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 25px;
        }
        .score-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #ffd700;
        }
        canvas {
            max-width: 100%;
            background: #1a1a2e;
            border-radius: 50%;
            margin: 20px auto;
        }
        button {
            background: linear-gradient(90deg, #ff4757, #ff6b81);
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 15px;
            color: white;
            font-size: 1.2em;
            font-weight: bold;
            margin: 10px 0;
            cursor: pointer;
        }
        .result {
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            padding: 15px;
            margin: 15px 0;
        }
        .menu {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 20px;
        }
        .menu button {
            background: rgba(255,255,255,0.1);
            font-size: 1em;
            padding: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🎰 بِت رِد | BetRed</h1>
        <p>گردونه شانس روزانه</p>
    </div>
    
    <div class="score">
        <div>💰 الماس شما</div>
        <div class="score-value" id="balance">در حال دریافت...</div>
    </div>
    
    <canvas id="wheelCanvas" width="300" height="300"></canvas>
    <button id="spinBtn">🎡 چرخوندن گردونه</button>
    <div class="result" id="result">⏳ برای چرخوندن دکمه رو بزن</div>
    
    <div class="menu">
        <button onclick="askBalance()">💰 موجودی</button>
        <button onclick="openBot()">📲 ربات</button>
    </div>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    
    // بخش‌های گردونه
    const segments = [
        { label: "10", value: 10, color: "#ff4757" },
        { label: "20", value: 20, color: "#2ed573" },
        { label: "30", value: 30, color: "#1e90ff" },
        { label: "50", value: 50, color: "#ffa502" },
        { label: "100", value: 100, color: "#ff6b81" },
        { label: "0", value: 0, color: "#a4b0be" },
        { label: "5", value: 5, color: "#70a1ff" },
        { label: "15", value: 15, color: "#7bed9f" }
    ];
    
    let currentAngle = 0;
    let spinning = false;
    let lastSpin = localStorage.getItem('lastSpin');
    let canSpin = true;
    
    // چک کردن ۲۴ ساعت
    if (lastSpin) {
        let diff = (Date.now() - parseInt(lastSpin)) / (1000 * 60 * 60);
        if (diff < 24) {
            canSpin = false;
            let remaining = Math.ceil(24 - diff);
            document.getElementById('result').innerHTML = `⏳ چرخش بعدی: ${remaining} ساعت دیگه`;
            document.getElementById('spinBtn').disabled = true;
        }
    }
    
    function drawWheel() {
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const size = canvas.width;
        const center = size / 2;
        const radius = size / 2 - 5;
        const angleStep = (Math.PI * 2) / segments.length;
        
        ctx.clearRect(0, 0, size, size);
        
        for (let i = 0; i < segments.length; i++) {
            const start = currentAngle + i * angleStep;
            const end = start + angleStep;
            ctx.beginPath();
            ctx.moveTo(center, center);
            ctx.arc(center, center, radius, start, end);
            ctx.fillStyle = segments[i].color;
            ctx.fill();
            ctx.save();
            ctx.translate(center, center);
            ctx.rotate(start + angleStep / 2);
            ctx.fillStyle = "#fff";
            ctx.font = "bold 16px 'Segoe UI'";
            ctx.fillText(segments[i].label, radius - 25, 8);
            ctx.restore();
        }
        
        ctx.beginPath();
        ctx.moveTo(center - 10, 10);
        ctx.lineTo(center + 10, 10);
        ctx.lineTo(center, 25);
        ctx.fillStyle = "#ff4757";
        ctx.fill();
    }
    
    // ارسال درخواست به ربات
    function sendToBot(action, amount = 0) {
        tg.sendData(JSON.stringify({ action: action, amount: amount }));
    }
    
    async function spinWheel() {
        if (spinning || !canSpin) return;
        
        spinning = true;
        const spinBtn = document.getElementById('spinBtn');
        spinBtn.disabled = true;
        
        const spinAngle = 360 * 8 + Math.random() * 360;
        const targetSegment = Math.floor(Math.random() * segments.length);
        const targetValue = segments[targetSegment].value;
        
        const startAngle = currentAngle;
        const endAngle = startAngle + (spinAngle * Math.PI / 180);
        const duration = 3000;
        const startTime = performance.now();
        
        function animate(currentTime) {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const easeOut = 1 - Math.pow(1 - progress, 3);
            currentAngle = startAngle + (endAngle - startAngle) * easeOut;
            drawWheel();
            
            if (progress < 1) {
                requestAnimationFrame(animate);
            } else {
                currentAngle = endAngle % (Math.PI * 2);
                drawWheel();
                
                document.getElementById('result').innerHTML = `🎉 تبریک! ${targetValue} الماس برنده شدی! 🎉`;
                sendToBot('spin', targetValue);
                
                localStorage.setItem('lastSpin', Date.now().toString());
                canSpin = false;
                
                spinning = false;
            }
        }
        
        requestAnimationFrame(animate);
    }
    
    function askBalance() {
        sendToBot('balance');
        tg.close();
    }
    
    function openBot() {
        tg.openTelegramLink('https://t.me/SelfsazRedBot');
        tg.close();
    }
    
    document.getElementById('spinBtn').onclick = spinWheel;
    
    drawWheel();
    
    // فقط یه پیام خوش‌آمدگویی
    setTimeout(() => {
        document.getElementById('balance').innerHTML = '👆 روی دکمه موجودی کلیک کن';
    }, 1000);
</script>
</body>
</html>
